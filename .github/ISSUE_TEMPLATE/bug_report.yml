name: Bug report
description: Report something that does not work as expected.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that shows the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: If known, include the commit or version you are running.
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Screenshots or errors can help. Remove personal notes and credentials before sharing.
