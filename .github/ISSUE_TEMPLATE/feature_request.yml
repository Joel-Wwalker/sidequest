name: Feature request
description: Suggest an improvement to SIDEQUEST.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe where the current workflow gets in your way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Explain how you would like it to work. An example is helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Share anything you have tried or other approaches worth considering.
