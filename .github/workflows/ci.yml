name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
